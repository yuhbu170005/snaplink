spring:
  application:
    name: snaplink-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 3000ms

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:your_super_secret_key_at_least_256_bits_long_default_snaplink_secret}
    expiration-ms: ${JWT_EXPIRATION:86400000}


