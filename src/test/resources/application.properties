# H2 chạy trong RAM; các Redis boundary được mock trong test, không truy cập cloud.
spring.datasource.url=jdbc:h2:mem:snaplinktest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
spring.data.redis.url=redis://localhost:6379
spring.data.redis.timeout=100ms
spring.data.redis.repositories.enabled=false
app.base-url=http://localhost:8080
app.jwt.secret=test-only-secret-at-least-32-bytes-long-do-not-use-in-production
app.jwt.expiration-ms=86400000
app.trust-proxy-headers=false
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
